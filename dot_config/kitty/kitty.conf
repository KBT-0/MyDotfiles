background_opacity          0.8
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf

# Sekme çubuğu: Windows Terminal gibi üstte, hep görünür, aralıklı düz sekmeler.
# Renkler Noctalia temasından gelir (active_tab_* / inactive_tab_*).
tab_bar_edge            top
tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           " "
tab_bar_margin_width    8
tab_bar_margin_height   6 0
tab_title_max_length    28
tab_title_template      "  {title}  "
active_tab_font_style   bold
inactive_tab_font_style normal

# ---- Windows Terminal kisayollari (kitty'nin kendi kisayollari da calismaya devam eder) ----
# Komut calisirken pencere/sekme kapatilirsa onay sor
confirm_os_window_close -1
# splits ilk sirada (bolme icin), diger layout'lar Ctrl+Shift+L ile hala gezilebilir
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Kopyala / yapistir (Ctrl+C: secim varsa kopyalar, yoksa programi durdurur)
map ctrl+c        copy_or_interrupt
map ctrl+v        paste_from_clipboard

# Sekmeler: Ctrl+Shift+N ve Ctrl+Alt+N -> N. sekme
map ctrl+shift+d  new_tab_with_cwd
map ctrl+shift+1  goto_tab 1
map ctrl+shift+2  goto_tab 2
map ctrl+shift+3  goto_tab 3
map ctrl+shift+4  goto_tab 4
map ctrl+shift+5  goto_tab 5
map ctrl+shift+6  goto_tab 6
map ctrl+shift+7  goto_tab 7
map ctrl+shift+8  goto_tab 8
map ctrl+shift+9  goto_tab 9
map ctrl+alt+1    goto_tab 1
map ctrl+alt+2    goto_tab 2
map ctrl+alt+3    goto_tab 3
map ctrl+alt+4    goto_tab 4
map ctrl+alt+5    goto_tab 5
map ctrl+alt+6    goto_tab 6
map ctrl+alt+7    goto_tab 7
map ctrl+alt+8    goto_tab 8
map ctrl+alt+9    goto_tab 9

# Bolmeler
map alt+shift+plus  launch --location=vsplit --cwd=current
map alt+shift+equal launch --location=vsplit --cwd=current
map alt+shift+minus launch --location=hsplit --cwd=current
map alt+shift+d     launch --location=split --cwd=current
map alt+left        neighboring_window left
map alt+right       neighboring_window right
map alt+up          neighboring_window up
map alt+down        neighboring_window down
map alt+shift+left  resize_window narrower 2
map alt+shift+right resize_window wider 2
map alt+shift+up    resize_window taller 2
map alt+shift+down  resize_window shorter 2

# Yazi boyutu, tam ekran
map ctrl+equal     change_font_size all +1.0
map ctrl+plus      change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0
map f11            toggle_fullscreen
map alt+enter      toggle_fullscreen

# Sag tik: secim varsa kopyala, yoksa yapistir (Windows Terminal gibi)
mouse_map right press ungrabbed kitten copy_or_paste.py
